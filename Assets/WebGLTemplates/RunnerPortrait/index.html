<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="Monster Strike Runner"></canvas>
    <div id="unity-loading-bar" role="status">
      <img class="hero" src="hero.png" alt="Runner hero">
      <h1>MONSTER STRIKE<br>RUNNER</h1>
      <p>Swipe to aim. Attack or charge. Stop every monster.</p>
      <progress id="progress" max="1" value="0"></progress>
      <p id="loading-label">Loading 0%</p>
    </div>
    <div id="unity-warning" role="alert" hidden></div>
  </main>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    function unityShowBanner(message, type) {
      var banner = document.querySelector("#unity-warning");
      banner.hidden = false;
      banner.textContent = message;
      if (type !== "error") setTimeout(() => { banner.hidden = true; }, 5000);
    }
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };


    config.devicePixelRatio = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
    function fitCanvas() {
      var viewport = window.visualViewport;
      var width = viewport ? viewport.width : window.innerWidth;
      var height = viewport ? viewport.height : window.innerHeight;
      var gameWidth = Math.min(width, height * 480 / 854);
      var container = document.querySelector("#unity-container");
      container.style.width = gameWidth + "px";
      container.style.height = gameWidth * 854 / 480 + "px";
    }
    window.addEventListener("resize", fitCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCanvas);
    fitCanvas();
    canvas.addEventListener("contextmenu", event => event.preventDefault());
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onerror = () => unityShowBanner("Game files could not load. Refresh and check your connection.", "error");
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.querySelector("#progress").value = progress;
        document.querySelector("#loading-label").textContent = "Loading " + Math.round(progress * 100) + "%";
      }).then(() => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        canvas.focus();
      }).catch(message => unityShowBanner(message, "error"));
    };
    if (window.location.protocol === "file:") {
      unityShowBanner("Use Unity Build And Run or an HTTP server to open this game.", "error");
    } else {
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
